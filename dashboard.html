<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyntra | Painel da Equipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Zyntra Team</span>
            <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2.5 py-1 rounded-full border border-indigo-500/30">Área Restrita</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-slate-400"><i class="fa-solid fa-user-shield mr-2"></i>Equipe Admin</span>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Sair</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Monitoramento de Clientes</h1>
                <p class="text-sm text-slate-400">Acompanhe as renovações, pagamentos e status das empresas cadastradas.</p>
            </div>
            <button onclick="adicionarEmpresaModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-plus mr-2"></i> Nova Empresa
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total de Clientes</p>
                <h3 class="text-2xl font-bold text-white mt-1" id="total-clientes">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <p class="text-xs text-emerald-400 uppercase tracking-wider font-semibold">Pagamentos em Dia</p>
                <h3 class="text-2xl font-bold text-white mt-1" id="total-pagos">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <p class="text-xs text-amber-400 uppercase tracking-wider font-semibold">Pendentes / Vencendo</p>
                <h3 class="text-2xl font-bold text-white mt-1" id="total-pendentes">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <p class="text-xs text-blue-400 uppercase tracking-wider font-semibold">Faturamento Estimado</p>
                <h3 class="text-2xl font-bold text-white mt-1" id="total-faturamento">R$ 0,00</h3>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="py-3 px-6">Empresa / Contato</th>
                            <th class="py-3 px-6">Plano</th>
                            <th class="py-3 px-6">Valor</th>
                            <th class="py-3 px-6">Renovação</th>
                            <th class="py-3 px-6">Status</th>
                            <th class="py-3 px-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-empresas" class="divide-y divide-slate-800 text-sm">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="painel.js"></script>
</body>
</html>
