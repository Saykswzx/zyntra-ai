<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Zyntra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Zyntra</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="solucoes.html">Soluções</a>
            <a href="tecnologia.html">Tecnologia</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>


    <main>

        <section class="contato">

            <h2>Entre em contato</h2>

            <p>
                Preencha o formulário abaixo e nossa equipe entrará em contato com você.
            </p>


            <form>

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome">


                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">


                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="Digite seu número de telefone">


                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>


                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 Zyntra - Todos os direitos reservados.</p>
    </footer>


</body>

</html>
