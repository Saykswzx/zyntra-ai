<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Zyntra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Zyntra<span>.</span></div>

        <nav>
            <a href="index.html">Início</a>
            <a href="solucoes.html">Soluções</a>
            <a href="tecnologia.html">Tecnologia</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Entre em contato</h2>

            <p>
                Preencha o formulário abaixo e nossa equipe entrará em contato com você.
            </p>

            <form>
                <label for="nome">Nome
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </label>

                <label for="email">E-mail
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </label>

                <label for="telefone">Telefone
                    <input type="tel" id="telefone" placeholder="Digite seu número de telefone">
                </label>

                <label for="mensagem">Mensagem
                    <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>
                </label>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Zyntra - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
